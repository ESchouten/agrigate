name: release
# One release per version, with everything in it:
#   update.ini                    the devices' update manifest: one signed block per board, naming
#                                 that board's file. The only fixed name: devices look for it in
#                                 releases/latest (settings > Wifi > Update, or automatically)
#   agrigate-clean-<board>-<v>.bin  the firmware per board (now: m5stack-core = the M5 buttons)
#   agrigate-clean-<board>-<v>.elf  the same with its symbols, to read a crash (GET /api/crash)
#   agrigate-clean-<v>.apk        Android app (install by hand, or keep it updated with Obtainium)
#   agrigate-clean-<v>-windows.exe, -macos.pkg   the desktop app's installers (not signed);
#                                 the app then updates itself from releases.<win|osx>.signed.json
#                                 (signed with the release key) and the -full.nupkg it names
#   agrigate-clean_<v>_amd64.deb  the Linux app; also in the apt repository on GitHub Pages
# Run it by hand (Actions > release > Run workflow) when a version should go out.
# The M5s download from github.com/<FW_REPO>/releases/latest, so every release must carry the
# firmware: that is why the apps are not released separately.
#
# Secrets:
#   BUILD_SECRETS                the secrets built into the apps and firmware: NAME=value lines,
#                                the same as ~/.scraper-control/secrets (tools/secrets.py)
#   FIRMWARE_SIGNING_KEY         the release key, ECDSA P-256 PEM; public half in
#                                firmware/src/ReleaseKey.h and the desktop app (DesktopUpdates)
#   ANDROID_KEYSTORE             the app's signing keystore, base64 (same key for every version,
#                                or Android refuses to install an update over the old app)
#   ANDROID_KEYSTORE_PASSWORD    its password (alias "scraper-control")
#   APT_SIGNING_KEY              OpenPGP private key (armored, no passphrase) of the apt repository
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read # the ci run of this commit

jobs:
  version: # 1.6.120: agrigate.version + the build number (commit count + agrigate.buildBase)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          BUILD=$(( $(git rev-list --count HEAD) + $(sed -n 's/^agrigate.buildBase=//p' native/gradle.properties) ))
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^agrigate.version=//p' native/gradle.properties).$BUILD" >> "$GITHUB_OUTPUT"
      - name: Tested? (a release only builds; workflow ci has tested this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the run's own conclusion: GitHub's status=success filter can miss a run for a while
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" -q '[.workflow_runs[] | select(.conclusion == "success")] | length')
          test "$n" -gt 0 || { echo "ci has not passed for $GITHUB_SHA (yet)"; exit 1; }

  firmware:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # What ci compiled (read only: a release build carries the secrets, ci's must not)
      - uses: actions/cache/restore@v6
        with:
          # sdkconfig.defaults: by its first line the platform knows its libraries are built
          path: |
            ~/.platformio
            firmware/sdkconfig.defaults
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/cache/restore@v6
        with:
          path: firmware/.pio/build
          key: pio-build-${{ hashFiles('firmware/platformio.ini') }}-${{ github.sha }}
          restore-keys: pio-build-${{ hashFiles('firmware/platformio.ini') }}-
      - run: pip install platformio
      - name: Build secrets
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: python3 tools/secrets.py --release
      - name: Build
        working-directory: firmware
        run: pio run
      - name: Sign
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          test -n "$FIRMWARE_SIGNING_KEY" || { echo "secret FIRMWARE_SIGNING_KEY is missing"; exit 1; }
          mkdir out
          BIN="out/agrigate-clean-m5stack-core-$VERSION.bin"
          grep -q "$VERSION" firmware/.pio/build/m5stack-core/firmware.bin || { echo "the firmware does not carry version $VERSION"; exit 1; }
          cp firmware/.pio/build/m5stack-core/firmware.bin "$BIN"
          cp firmware/.pio/build/m5stack-core/firmware.elf "${BIN%.bin}.elf"   # reads a crash (docs/API.md)
          echo "# Agrigate Clean $VERSION: one block per board" > out/update.ini
          python3 firmware/sign_release.py "$BIN" --board m5stack-core --key "$FIRMWARE_SIGNING_KEY" --version "$VERSION" --build "$BUILD" >> out/update.ini
          cat out/update.ini
      - name: First-install image (bootloader, partitions and app in one file, from address 0)
        run: |
          pip install "esptool>=5"
          B=firmware/.pio/build/m5stack-core
          esptool --chip esp32 merge-bin -o "out/agrigate-clean-m5stack-core-$VERSION-full.bin" \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: out/

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true # ci's caches; a release adds nothing to them
      - name: Build secrets
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: python3 tools/secrets.py --release
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$ANDROID_KEYSTORE" || { echo "secret ANDROID_KEYSTORE is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AGRIGATE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: native
        env:
          AGRIGATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease --console=plain
          mkdir ../out
          cp androidApp/build/outputs/apk/release/*.apk "../out/agrigate-clean-$VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/

  desktop:
    needs: version
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest] # macos-latest (macOS 26) often finds no free runner
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true # ci's caches; a release adds nothing to them
      - uses: actions/setup-dotnet@v6 # Velopack's vpk runs on .NET 10; the Mac runner has none where vpk looks
        if: runner.os != 'Linux'
        with:
          dotnet-version: "10.0.x"
      - name: Build secrets
        shell: bash
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: python tools/secrets.py --release
      - name: The installer (Windows, macOS - Velopack, it keeps the app up to date - or Linux .deb)
        working-directory: native
        shell: bash
        run: |
          mkdir -p ../out
          if [ "$RUNNER_OS" = Linux ]; then   # updates through the apt repository (job installer)
            ./gradlew :composeApp:packageDeb --console=plain
            cp composeApp/build/compose/binaries/main/deb/*.deb ../out/
          else
            ./gradlew :composeApp:velopack --console=plain
            v=composeApp/build/velopack
            cp $v/*-full.nupkg $v/releases.*.json ../out/   # the app updates from these (publish signs the feed)
            if [ "$RUNNER_OS" = macOS ]; then cp $v/*-Setup.pkg "../out/agrigate-clean-$VERSION-macos.pkg"
            else cp $v/*-Setup.exe "../out/agrigate-clean-$VERSION-windows.exe"; fi
          fi
          ls ../out
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: out/
          if-no-files-found: error

  # The browser installer for the buttons (docs/install) on GitHub Pages, with this release's
  # first-install image. Pages must be set to "GitHub Actions" once (Settings > Pages).
  installer:
    needs: [version, firmware, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write # removes an earlier try's page artifact
    environment:
      name: github-pages
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: fw
      - uses: actions/download-artifact@v8
        with:
          name: desktop-ubuntu-latest
          path: linux
      - name: Page, manifest and image
        run: |
          mkdir site
          cp docs/install/index.html site/
          cp "fw/agrigate-clean-m5stack-core-$VERSION-full.bin" site/agrigate-clean-m5stack-core-full.bin
          cat > site/manifest.json <<JSON
          {"name": "Agrigate Clean buttons", "version": "$VERSION", "new_install_prompt_erase": true,
           "builds": [{"chipFamily": "ESP32", "parts": [{"path": "agrigate-clean-m5stack-core-full.bin", "offset": 0}]}]}
          JSON
      - name: Apt repository with this release's .deb (sudo apt upgrade; README > Install), signed
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY" || { echo "secret APT_SIGNING_KEY is missing"; exit 1; }
          command -v apt-ftparchive || sudo apt-get install -y --no-install-recommends apt-utils   # gone from the runner image (2026-11-20)
          mkdir -p site/apt/pool/main site/apt/dists/stable/main/binary-amd64
          cp linux/*.deb site/apt/pool/main/
          cd site/apt
          dpkg-scanpackages --arch amd64 pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9k dists/stable/main/binary-amd64/Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin="Agrigate" -o APT::FTPArchive::Release::Label="Agrigate" \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 -o APT::FTPArchive::Release::Components=main \
            release dists/stable > Release   # written outside dists/stable, or it lists itself
          mv Release dists/stable/
          export GNUPGHOME="$RUNNER_TEMP/gnupg" && mkdir -m 700 "$GNUPGHOME"
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --export > agrigate.gpg   # the key apt checks (signed-by)
      - name: A second try of this job starts clean (two page artifacts stop the deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -q '.artifacts[] | select(.name == "github-pages") | .id' |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5

  publish:
    needs: [version, firmware, android, desktop]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "{firmware,android,desktop-*}" # not the installer's github-pages
          path: dist
          merge-multiple: true
      - name: Sign the desktop apps' update feeds (app/DesktopUpdates checks them)
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          for f in dist/releases.*.json; do
            python3 firmware/sign_release.py --feed "$f" --key "$FIRMWARE_SIGNING_KEY" > "${f%.json}.signed.json"
            rm "$f"
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -laR dist
          gh release create "v$VERSION" dist/* \
            --title "Agrigate Clean $VERSION" \
            --notes "Agrigate Clean $VERSION.

          - M5 buttons: they install this version themselves (settings, or automatically once a day / on a new wifi connection).
          - Android: install the .apk, or follow this repository with Obtainium for automatic updates.
          - Desktop: .exe (Windows) and .pkg (macOS): install once, after that the app offers each new version itself. Not signed: on Windows, More info > Run anyway; on a Mac, right-click > Open the first time. Linux: .deb, or the apt repository (README) so that apt upgrade keeps it up to date."
