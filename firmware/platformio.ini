; Agrigate Clean buttons: M5Stack Basic (ESP32) with 3 buttons = route A / B / C.
; Build and flash over USB:  pio run -t upload   (after that it updates itself from the releases)
[env:m5stack-core]
; pioarduino: the released Arduino core 3.3.12 (ESP-IDF 5.5.5) with its ESP-IDF libraries built
; from custom_sdkconfig below (the stock ones carry Bluetooth parts a robot never uses).
; A develop commit, not release 55.03.312-1: that one fails on a fresh install (pioarduino
; issue 563). Back to a release once the one for Arduino 3.3.13 is out.
platform = https://github.com/pioarduino/platform-espressif32.git#925d933c5901be9ab5eafdc6c849cf041113ec04
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12-libs.tar.xz
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
; 16 MB flash (Basic v2.7): two 6 MB app slots, so updates can come over wifi.
board_build.partitions = partitions.csv
; RAM for Bluetooth next to the wifi and the web API (no PSRAM on the Basic): no Bluetooth
; audio, hands-free or mesh, and one robot link at a time
custom_sdkconfig =
  '# CONFIG_BT_A2DP_ENABLE is not set'
  '# CONFIG_BT_HFP_ENABLE is not set'
  '# CONFIG_BLE_MESH is not set'
  CONFIG_BTDM_CTRL_BLE_MAX_CONN=1
  CONFIG_BTDM_CTRL_BR_EDR_MAX_ACL_CONN=1
  CONFIG_BTDM_CTRL_BR_EDR_MAX_SYNC_CONN=0
  CONFIG_BT_ACL_CONNECTIONS=2
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
; FW_VERSION / FW_BUILD for main.cpp: the apps' version and the commit count (version.py)
extra_scripts = pre:version.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=0
  ; WiFi.h includes Network.h, but the library finder does not give WiFi that include path
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
  ; the same for Preferences, which the framework's BLE library includes
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Preferences/src
  ; the screens are drawn with LVGL; its settings are include/lv_conf.h
  -DLV_CONF_INCLUDE_SIMPLE -DLV_LVGL_H_INCLUDE_SIMPLE -I${PROJECT_DIR}/include
  -DLV_CONF_KCONFIG_EXTERNAL_INCLUDE=\"lv_no_kconfig.h\"
lib_deps =
  m5stack/M5Unified@^0.2.2
  lvgl/lvgl@9.2.2                        ; the screens (pinned: test_host builds the same version)
  symlink://../drivers/discovery              ; the robot driver (the same code as in the apps)
lib_ldf_mode = deep+

