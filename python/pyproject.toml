[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrigate"
version = "1.6"
description = "Agrigate: manure robots over Bluetooth, milking robots and the herd from the farm's server"
requires-python = ">=3.9"
dependencies = ["bleak>=0.22"]

[tool.setuptools]
packages = ["agrigate"]
