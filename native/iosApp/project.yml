# The iOS app (SwiftUI) on top of the shared Kotlin module. Generate the Xcode project with
#   brew install xcodegen && cd native/iosApp && xcodegen
# then open AgrigateClean.xcodeproj. The build runs Gradle for the Shared framework and
# set-version.sh for the version (1.6.<build>). UI tests: ./run-ui-tests.sh
name: AgrigateClean
options:
  bundleIdPrefix: com.eschouten.agrigate
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS: [-framework, Shared, -lc++]
    # the Shared framework is built for Apple Silicon simulators only (iosSimulatorArm64)
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targetTemplates:
  # The app and the widgets: the Shared framework before, the version into Info.plist after.
  SharedModule:
    preBuildScripts:
      - name: Shared Kotlin module
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.." && ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      - name: Version MAJOR.MINOR.build
        basedOnDependencyAnalysis: false
        # the processed Info.plist as input: Xcode then runs this after it, not before
        inputFiles: ["$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"]
        script: |
          "$SRCROOT/set-version.sh"
targets:
  AgrigateClean:
    type: application
    platform: iOS
    templates: [SharedModule]
    sources: [AgrigateClean, Intents]
    dependencies:
      - target: CleanWidgets
    # merged with the keys below (GENERATE_INFOPLIST_FILE): plain http to a device on the own
    # network, for a robot through another device's web API (docs/API.md)
    info:
      path: AgrigateClean/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Om de robot te bedienen via een ander apparaat in je netwerk.
        CFBundleURLTypes:   # agrigate-clean://add?... from the QR code of the buttons or a computer
          - CFBundleURLName: com.eschouten.agrigate.clean.add
            CFBundleURLSchemes: [agrigate-clean]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eschouten.agrigate.clean
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agrigate Clean
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Om de robot te bedienen via Bluetooth.
        CODE_SIGN_ENTITLEMENTS: AgrigateClean/App.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  CleanWidgets:
    type: app-extension
    platform: iOS
    templates: [SharedModule]
    deploymentTarget: "17.0"
    sources: [Widgets, Intents, AgrigateClean/Theme.swift]   # the app's colours and route badge
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Agrigate Clean
        NSBluetoothAlwaysUsageDescription: Om de robot te bedienen via Bluetooth.   # a tap connects from here
        NSLocalNetworkUsageDescription: Om de robot te bedienen via een ander apparaat in je netwerk.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eschouten.agrigate.clean.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
  AgrigateCleanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AgrigateClean
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.eschouten.agrigate.clean.uitests
        TEST_TARGET_NAME: AgrigateClean
schemes:
  AgrigateClean:
    build:
      targets:
        AgrigateClean: all
        AgrigateCleanUITests: [test]
    test:
      targets: [AgrigateCleanUITests]
      gatherCoverageData: false
